<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            padding: 40px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
        h1 {
            margin-bottom: 10px;
        }
        .galerie {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Photo Album</h1>
        <p>Welcome to my visual space.</p>
    </header>

    <main class="galerie">
        <!-- Your shark photo -->
        <div class="photo-card">
            <img src="shark1.jpg" alt="Carcharhinus melanopterus">
        </div>
    </main>

</body>
</html>
