<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            position: relative;
            padding: 80px 20px;
            background-image: url('pexels-daniloriba-10939645.jpg');
            background-size: cover;
            background-position: center;
            color: white;
        }
        /* Voile sombre pour l'en-tête */
        header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        header h1, header p, header nav {
            position: relative;
            z-index: 2;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        /* Style pour les onglets de navigation */
        nav {
            margin-top: 20px;
        }
        .nav-btn {
            background-color: rgba(255, 255, 255, 0.85);
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            color: #333;
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: #0077cc;
            color: white;
        }
        .galerie {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            cursor: pointer; /* Indique qu'on peut cliquer */
            transition: transform 0.3s ease;
        }
        .photo-card img:hover {
            transform: scale(1.03); /* Petit zoom léger au survol */
        }
        .photo-info {
            padding: 15px;
            font-size: 14px;
            color: #666;
        }

        /* Style pour la visionneuse plein écran (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>Lise's photos</h1>
        <p>Welcome to my visual space.</p>
        
        <!-- Les onglets de navigation -->
        <nav>
            <button class="nav-btn active" onclick="filterPhotos('all')">All</button>
            <button class="nav-btn" onclick="filterPhotos('marine')">Marine</button>
            <button class="nav-btn" onclick="filterPhotos('macro')">Macro</button>
        </nav>
    </header>

    <main class="galerie" id="gallery-container">
        <!-- Photo Marine (votre requin) -->
        <div class="photo-card" data-category="marine">
            <img src="sharks1.jpg" alt="Carcharhinus melanopterus" onclick="openLightbox(this.src)">
            <div class="photo-info">Marine - Blacktip reef sharks</div>
        </div>
        
         <div class="photo-card" data-category="marine">
            <img src="turtle1.jpeg" alt="Carcharhinus melanopterus" onclick="openLightbox(this.src)">
            <div class="photo-info">Marine - Sea turtle reef</div>
        </div>
        
        <div class="photo-card" data-category="macro">
            <img src="seastar1.jpeg" alt="Asteria Rubens" onclick="openLightbox(this.src)">
            <div class="photo-info">Macro - Asteria Rubens</div>
        </div>  

        <div class="photo-card" data-category="macro">
            <img src="urchin2.jpeg" alt="Psammechinus miliaris" onclick="openLightbox(this.src)">
            <div class="photo-info">Macro - Psammechinus miliaris</div>
        </div>  
    </main>

    <!-- Fenêtre modale (Lightbox) pour afficher l'image en grand -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Agrandissement">
    </div>

    <script>
        // Fonction pour filtrer les photos par onglets
        function filterPhotos(category) {
            const cards = document.querySelectorAll('.photo-card');
            const buttons = document.querySelectorAll('.nav-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Fonction pour ouvrir l'image en grand
        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageSrc;
            lightbox.style.display = 'flex';
        }

        // Fonction pour fermer l'image en grand (au clic)
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
        }
    </script>

</body>
</html>
