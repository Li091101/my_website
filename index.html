<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            padding: 40px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
        h1 {
            margin-bottom: 10px;
        }
        /* Style pour les onglets de navigation */
        nav {
            margin-top: 20px;
        }
        .nav-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: #0077cc;
            color: white;
        }
        .galerie {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .photo-info {
            padding: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lise's photos</h1>
        <p>Welcome to my visual space.</p>
        
        <!-- Les onglets de navigation -->
        <nav>
            <button class="nav-btn active" onclick="filterPhotos('all')">All</button>
            <button class="nav-btn" onclick="filterPhotos('marine')">Marine</button>
            <button class="nav-btn" onclick="filterPhotos('macro')">Macro</button>
        </nav>
    </header>

    <main class="galerie" id="gallery-container">
        <!-- Photo Marine (votre requin) -->
        <div class="photo-card" data-category="marine">
            <img src="sharks1.jpg" alt="Carcharhinus melanopterus">
            <div class="photo-info">Marine - Blacktip reef sharks</div>
        </div>
        
        <div class="photo-card" data-category="macro">
            <img src="seastar1.jpg" alt="Asteria Rubens">
            <div class="photo-info">Macro - Details</div>
        </div> 

         <div class="photo-card" data-category="macro">
            <img src="seastar1.jpg" alt="Asteria Rubens">
            <div class="photo-info">Macro - Details</div>
        </div> 
        -->
    </main>

    <script>
        // Petit script magique pour faire fonctionner les onglets
        function filterPhotos(category) {
            const cards = document.querySelectorAll('.photo-card');
            const buttons = document.querySelectorAll('.nav-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
